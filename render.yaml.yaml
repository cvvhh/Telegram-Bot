services:
  - type: worker
    name: telegram-notifier-bot
    runtime: dotnet
    repo: https://github.com/cvvhh/Telegram-Bot.git
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet ./out/TelegramNotifierBot.dll